<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Journal Dashboard</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="dashboard-bg"></div>

<!-- TOPBAR -->

<div class="topbar">

    <div>

        <h1>📘 Journal Dashboard</h1>

        <p>Spring Boot + JWT + MongoDB + Swagger APIs</p>

    </div>

    <div class="top-buttons">

        <button class="green-btn"
                onclick="loadJournals()">

            📚 Journals

        </button>

        <button class="blue-btn"
                onclick="loadUsers()">

            👤 Admin Users

        </button>

        <!-- ADD THIS -->

        <button class="cyan-btn"
                onclick="document.getElementById('create-user-section').scrollIntoView({behavior:'smooth'})">

            ➕ Create User

        </button>

        <button class="orange-btn"
                onclick="loadProfile()">

            🧑 Profile

        </button>

        <button class="purple-btn"
                onclick="healthCheck()">

            💚 Health

        </button>

        <button class="gray-btn"
                onclick="clearCache()">

            🧹 Clear Cache

        </button>

        <button class="red-btn"
                onclick="logout()">

            🚪 Logout

        </button>

    </div>

</div>

<!-- MAIN -->

<div class="container">

    <!-- GREETING -->

    <div class="api-card glow-card">

        <div class="api-header green">

            <span class="method">GET</span>

            <span>/user</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadGreeting()">

                Execute

            </button>

            <div id="greeting"
                 class="response-box">

            </div>

        </div>

    </div>

    <!-- CREATE JOURNAL -->

    <div class="api-card glow-card">

        <div class="api-header blue">

            <span class="method">POST</span>

            <span>/journal</span>

        </div>

        <div class="api-body">

            <div class="grid-2">

                <div>

                    <label>Journal Title</label>

                    <input
                            type="text"
                            id="title"
                            placeholder="Enter Journal Title">

                </div>

                <div>

                    <label>Sentiment</label>

                    <select id="sentiment">

                        <option value="HAPPY">
                            HAPPY
                        </option>

                        <option value="SAD">
                            SAD
                        </option>

                        <option value="ANGRY">
                            ANGRY
                        </option>

                        <option value="ANXIOUS">
                            ANXIOUS
                        </option>

                    </select>

                </div>

            </div>

            <label>Journal Content</label>

            <textarea
                    id="content"
                    placeholder="Write your journal content here...">

            </textarea>

            <button class="execute-btn"
                    onclick="createJournal()">

                ✨ Create Journal

            </button>

        </div>

    </div>

    <!-- CREATE USER -->

    <div class="api-card glow-card"
         id="create-user-section">

        <div class="api-header cyan">

            <span class="method">POST</span>

            <span>/public/signup</span>

        </div>

        <div class="api-body">

            <div class="grid-2">

                <div>

                    <label>Username</label>

                    <input
                            type="text"
                            id="newUsername"
                            placeholder="Enter Username">

                </div>

                <div>

                    <label>Email</label>

                    <input
                            type="email"
                            id="newEmail"
                            placeholder="Enter Email">

                </div>

            </div>

            <div class="grid-2">

                <div>

                    <label>Password</label>

                    <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter Password">

                </div>

                <div>

                    <label>Role</label>

                    <select id="newRole">

                        <option value="ROLE_USER">
                            ROLE_USER
                        </option>

                        <option value="ROLE_ADMIN">
                            ROLE_ADMIN
                        </option>

                    </select>

                </div>

            </div>

            <button class="execute-btn"
                    onclick="createUser()">

                ➕ Create User

            </button>

        </div>

    </div>

    <!-- JOURNALS -->

    <div class="api-card glow-card">

        <div class="api-header green">

            <span class="method">GET</span>

            <span>/journal</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadJournals()">

                Execute

            </button>

            <div id="journals"
                 class="journal-grid">

            </div>

        </div>

    </div>

    <!-- USERS -->

    <div class="api-card glow-card">

        <div class="api-header orange">

            <span class="method">GET</span>

            <span>/admin/all-users</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadUsers()">

                Execute

            </button>

            <div id="users"
                 class="user-grid">

            </div>

        </div>

    </div>

    <!-- PROFILE -->

    <div class="api-card glow-card">

        <div class="api-header purple">

            <span class="method">GET</span>

            <span>/user/profile</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadProfile()">

                Execute

            </button>

            <div id="profile"></div>

        </div>

    </div>

    <!-- HEALTH -->

    <div class="api-card glow-card">

        <div class="api-header gray">

            <span class="method">GET</span>

            <span>/health-check</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="healthCheck()">

                Execute

            </button>

            <div id="health"></div>

        </div>

    </div>

    <!-- TOKEN -->

    <div class="api-card glow-card">

        <div class="api-header blue">

            <span class="method">JWT</span>

            <span>Current Token</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="showToken()">

                Show Token

            </button>

            <div id="tokenBox"
                 class="response-box">

            </div>

        </div>

    </div>

</div>

<script src="/script.js"></script>

</body>
</html>
