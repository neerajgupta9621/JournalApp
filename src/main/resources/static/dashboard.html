<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Information System</title>


    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="dashboard-bg"></div>

<!-- TOPBAR -->

<div class="topbar">

    <div>

        <h1>👨‍💼 Employee Information System</h1>

        <p>Spring Boot + JWT + MongoDB Employee Management Portal</p>

    </div>

    <div class="top-buttons">

        <button class="green-btn"
                onclick="loadEmployees()">

            👨‍💼 Employees

        </button>

        <button class="blue-btn"
                onclick="loadUsers()">

            👨‍💼 Manage Employees

        </button>

        <!-- ADD THIS -->

        <button class="cyan-btn"
                onclick="document.getElementById('create-user-section').scrollIntoView({behavior:'smooth'})">

            ➕ Add Employee

        </button>

        <button class="orange-btn"
                onclick="loadProfile()">

            👤 Employee Profile

        </button>

        <button class="purple-btn"
                onclick="healthCheck()">

            💚 Health

        </button>

        <button class="gray-btn"
                onclick="clearCache()">

            🧹 Clear Cache

        </button>

        <button onclick="clearChat()" class="gray-btn">
            🧹 Clear Chat
        </button>

        <button class="red-btn"
                onclick="logout()">

            🚪 Logout

        </button>

        <button class="cyan-btn"
                onclick="document.getElementById('ai-section').scrollIntoView({behavior:'smooth'})">

            🤖 AI Assistant

        </button>

    </div>

</div>

<!-- MAIN -->

<div class="container">

    <!-- GREETING -->

    <div class="api-card glow-card">

        <div class="api-header green">

            <span class="method">GET</span>

            <span>/dashboard</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadGreeting()">

                Welcome Employee

            </button>

            <div id="greeting"
                 class="response-box">

            </div>

        </div>

    </div>

    <!-- ADD EMPLOYEE -->

    <div class="api-card glow-card">

        <div class="api-header blue">

            <span class="method">POST</span>

            <span>/employee</span>

        </div>

        <div class="api-body">

            <div class="grid-2">

                <div>

                    <label>Employee Name</label>

                    <input
                            type="text"
                            id="employeeName"
                            placeholder="Enter Employee Name">

                </div>

                <div>

                    <label>Department</label>

                    <select id="department">

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Sales">
                            Sales
                        </option>

                    </select>

                </div>

            </div>

            <label>Employee Details</label>

            <textarea
                    id="employeeDetails"
                    placeholder="Enter Employee Details">

            </textarea>

            <button class="execute-btn"
                    onclick="createEmployee()">

                ➕ Add Employee

            </button>

        </div>

    </div>

    <!-- Add Employee -->

    <div class="api-card glow-card"
         id="create-user-section">

        <div class="api-header cyan">

            <span class="method">POST</span>

            <span>/employee/register</span>

        </div>

        <div class="api-body">

            <div class="grid-2">

                <div>

                    <label>Username</label>

                    <input
                            type="text"
                            id="newUsername"
                            placeholder="Enter Username">

                </div>

                <div>

                    <label>Email</label>

                    <input
                            type="email"
                            id="newEmail"
                            placeholder="Enter Email">

                </div>

            </div>

            <div class="grid-2">

                <div>

                    <label>Password</label>

                    <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter Password">

                </div>

                <div>

                    <label>Role</label>

                    <select id="newRole">

                        <option value="ROLE_USER">
                            ROLE_USER
                        </option>

                        <option value="ROLE_ADMIN">
                            ROLE_ADMIN
                        </option>

                    </select>

                </div>

            </div>

            <button class="execute-btn"
                    onclick="createUser()">

                ➕ Add Employee

            </button>

            <button class="execute-btn"
                    onclick="createAdminUser()">

                👑 Create HR Manager

            </button>

        </div>

    </div>

    <!-- EMPLOYEE LIST -->

    <div class="api-card glow-card">

        <div class="api-header green">

            <span class="method">GET</span>

            <span>/employee</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadEmployees()">

                Load Data

            </button>

            <div id="employees"
                 class="employee-grid">

            </div>

        </div>

    </div>

    <!-- USERS -->

    <div class="api-card glow-card">

        <div class="api-header orange">

            <span class="method">GET</span>

            <span>/employee/all-users</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadUsers()">

                Load Employees

            </button>

            <div id="users"
                 class="user-grid">

            </div>

        </div>

    </div>

    <!-- PROFILE -->

    <div class="api-card glow-card">

        <div class="api-header purple">

            <span class="method">GET</span>

            <span>/employee/profile</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="loadProfile()">

                View Profile

            </button>

            <div id="profile"></div>

        </div>

    </div>

    <!-- HEALTH -->

    <div class="api-card glow-card">

        <div class="api-header gray">

            <span class="method">GET</span>

            <span>/system/status</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="healthCheck()">

                Check Status

            </button>

            <div id="health"></div>

        </div>

    </div>


    <!-- AI CHAT -->

    <div class="api-card glow-card" id="ai-section">

        <div class="api-header cyan">

            <span class="method">POST</span>

            <span>/ai/chat</span>

        </div>

        <div class="api-body">

            <label>Ask AI Assistant</label>

            <!-- Chat History -->
            <div
                    id="aiResponse"
                    class="response-box">

            </div>

            <!-- Input Box -->
            <textarea
                    id="aiPrompt"
                    placeholder="Ask about employee data...">
        </textarea>

            <!-- Buttons -->
            <div class="btn-group">

                <button
                        class="execute-btn"
                        onclick="askAI()">

                    🤖 Ask AI Assistant

                </button>

                <button
                        class="execute-btn"
                        onclick="analyzeEmployee()">

                    👨‍💼 AI Analyze Employee

                </button>

            </div>

        </div>

    </div>


    <!-- TOKEN -->

    <div class="api-card glow-card">

        <div class="api-header blue">

            <span class="method">JWT</span>

            <span>Current Login Token</span>

        </div>

        <div class="api-body">

            <button class="execute-btn"
                    onclick="showToken()">

                View Token

            </button>

            <div id="tokenBox"
                 class="response-box">

            </div>

        </div>

    </div>

</div>


<script src="/script.js"></script>

</body>
</html>
